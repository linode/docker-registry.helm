{{- if .Values.daemonset.enabled }}
{{- $hostSetupSh := .Files.Get "files/host-setup.sh" }}
{{- $cmData := dict "host-setup.sh" $hostSetupSh }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ template "docker-registry.fullname" . }}-hostconfig
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app: {{ template "docker-registry.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  {{- if .Values.daemonset.annotations }}
  annotations:
    {{- toYaml .Values.daemonset.annotations | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ template "docker-registry.name" . }}-hostconfig
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "docker-registry.name" . }}-hostconfig
        release: {{ .Release.Name }}
      annotations:
        configmap-hash: {{ $cmData | toYaml | sha256sum }}
    spec:
      hostNetwork: true
      {{- if .Values.daemonset.priorityClassName }}
      priorityClassName: "{{ .Values.daemonset.priorityClassName }}"
      {{- end }}
      containers:
        - name: registry-host-config
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - /configmap/host-setup.sh
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_NAME
              value: {{ template "docker-registry.fullname" . }}
            - name: SERVICE_PORT
              value: "{{ .Values.service.nodePort | default "" | required "service.nodePort required for daemonset to work" }}"
            - name: ADDITIONAL_HOSTS
              value: {{ .Values.daemonset.additionalHosts | join " " }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: etc
              mountPath: /host/etc/hosts
              subPath: hosts
            - name: etc
              mountPath: /host/etc/containerd
              subPath: containerd
            - name: configmap
              mountPath: /configmap
              readOnly: true
      volumes:
        - name: etc
          hostPath:
            path: /etc
        - name: configmap
          configMap:
            name: {{ template "docker-registry.fullname" . }}-hostconfig
      terminationGracePeriodSeconds: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "docker-registry.fullname" . }}-hostconfig
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app: {{ template "docker-registry.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  {{- if .Values.daemonset.annotations }}
  annotations:
    {{- toYaml .Values.daemonset.annotations | nindent 4 }}
  {{- end }}
{{ dict "data" $cmData | toYaml }}
{{- end }}
